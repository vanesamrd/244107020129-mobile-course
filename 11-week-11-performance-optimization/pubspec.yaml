name: notes_app
description: "Week 11 – Performance Optimization: Notes App with Gemini AI Assistant"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Local database
  sqflite: ^2.4.1
  path: ^1.9.1

  # HTTP client for the Gemini AI service
  http: ^1.2.0

  # Secure storage for AI API keys
  flutter_secure_storage: ^9.2.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
